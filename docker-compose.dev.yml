# Override per sviluppo locale — hot reload su frontend e backend.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:

  # ── Frontend ──────────────────────────────────────────────────────────────
  # Monta i sorgenti e avvia "next dev" invece di fare il build di produzione.
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_nm:/app/node_modules   # volume isolato: evita che il mount sovrascriva i moduli
    environment:
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:10170/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:10170/api/v1/ws}
      - WATCHPACK_POLLING=true   # necessario su Windows/WSL2 per far funzionare il file watcher

  # ── Backend ───────────────────────────────────────────────────────────────
  # I sorgenti sono già montati in docker-compose.yml (./backend:/app).
  # Aggiunge solo --reload a uvicorn per ricaricare automaticamente.
  backend:
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 10170 --reload"

volumes:
  frontend_nm:
