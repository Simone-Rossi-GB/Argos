services:
    nginx:
        image: nginx:alpine
        container_name: argos-nginx
        networks:
            - argos-network
        ports:
            - "8080:80"
            # - "4443:443" decommentare se non si usa ngrok
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
            - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
        depends_on:
            - backend
            - mediamtx
    
    backend:
        build:
            context: ./backend
        volumes:
            - ./backend:/app
        container_name: argos-backend
        networks:
            - argos-network
        expose:
            - "10170"
        depends_on:
            - db
            - mqtt
    
    db:
        image: postgres:16
        container_name: argos-db
        networks:
            - argos-network
        expose:
            - "5432"
        environment:
            POSTGRES_DB: argos
            POSTGRES_USER: argos
            POSTGRES_PASSWORD: argos
        volumes:
            - db-data:/var/lib/postgresql/data
    
    mqtt:
        image: eclipse-mosquitto
        container_name: argos-mqtt
        networks:
            - argos-network
        ports:
            - "1883:1883"
            # - "8883:8883" decommento quando metto tls
            - "9001:9001"
        volumes:
            - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
            - mqtt-data:/mosquitto/data/
    
    mediamtx:
        image: bluenviron/mediamtx
        container_name: argos-mediamtx
        networks:
            - argos-network
        ports:
            - "8888:8888"
            - "1935:1935"

    minio:
        image: minio/minio:latest
        container_name: minio
        ports:
            - "9000:9000"      # Console/API
            - "9001:9001"      # Web UI
        environment:
            MINIO_ROOT_USER: "minioadmin"
            MINIO_ROOT_PASSWORD: "minioadmin123"
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
networks:
    argos-network:
        driver: bridge

volumes:
    db-data:
    mqtt-data:
    minio_data: