services:
    nginx:
        image: nginx:alpine
        container_name: argos-nginx
        networks:
            - argos-network
        ports:
            - "8080:80"
            - "4443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - backend
            - mediamtx
    
    backend:
        build: ./backend
        container_name: argos-backend
        networks:
            - argos-network
        expose:
            - "10170"
        depends_on:
            - db
            - mqtt
            - server
    
    db:
        image: postgres:16
        container_name: argos-db
        networks:
            - argos-network
        expose:
            - "5432"
        environment:
            POSTGRES_DB: argos
            POSTGRES_USER: argos
            POSTGRES_PASSWORD: argos
        volumes:
            - db-data:/var/lib/postgresql/data
    
    mqtt:
        image: eclipse-mosquitto
        container_name: argos-mqtt
        networks:
            - argos-network
        ports:
            - "1883:1883"
            # - "8883:8883" decommento quando metto tls
            - "9001:9001"
        volumes:
            - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
            - mqtt-data:/mosquitto/data/
    
    mediamtx:
        image: bluenviron/mediamtx
        container_name: argos-mediamtx
        networks:
            - argos-network
        ports:
            - "8888:8888"
            - "1935:1935"

    # ── Authentik ─────────────────────────
    postgresql:
        image: docker.io/library/postgres:16-alpine
        container_name: argos-auth-db
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s
        volumes:
            - auth-db:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: ${PG_PASS:?database password required}
            POSTGRES_USER: ${PG_USER:-authentik}
            POSTGRES_DB: ${PG_DB:-authentik}
        networks:
            - argos-network

    redis:
        image: docker.io/library/redis:alpine
        container_name: argos-auth-redis
        command: --save 60 1 --loglevel warning
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 3s
        volumes:
            - auth-redis:/data
        networks:
            - argos-network

    server:
        image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.12.1}
        container_name: argos-auth-server
        restart: unless-stopped
        command: server
        environment:
            AUTHENTIK_REDIS__HOST: redis
            AUTHENTIK_POSTGRESQL__HOST: postgresql
            AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
            AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
            AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
            AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
            AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
            AUTHENTIK_EMAIL__HOST: ""
            AUTHENTIK_EMAIL__PORT: "587"
            AUTHENTIK_EMAIL__USERNAME: ""
            AUTHENTIK_EMAIL__PASSWORD: ""
            AUTHENTIK_EMAIL__USE_TLS: "false"
            AUTHENTIK_EMAIL__USE_SSL: "false"
            AUTHENTIK_EMAIL__FROM: ""
        volumes:
            - ./authentik/media:/media
            - ./authentik/custom-templates:/templates
        ports:
            - "127.0.0.1:9000:9000"   # dashboard Authentik, solo locale
        depends_on:
            postgresql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - argos-network

    worker:
        image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.12.1}
        container_name: argos-auth-worker
        restart: unless-stopped
        command: worker
        environment:
            AUTHENTIK_REDIS__HOST: redis
            AUTHENTIK_POSTGRESQL__HOST: postgresql
            AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
            AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
            AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
            AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
            AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
            AUTHENTIK_EMAIL__HOST: ""
            AUTHENTIK_EMAIL__PORT: "587"
            AUTHENTIK_EMAIL__USERNAME: ""
            AUTHENTIK_EMAIL__PASSWORD: ""
            AUTHENTIK_EMAIL__USE_TLS: "false"
            AUTHENTIK_EMAIL__USE_SSL: "false"
            AUTHENTIK_EMAIL__FROM: ""
        user: root
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./authentik/media:/media
            - ./authentik/certs:/certs
            - ./authentik/custom-templates:/templates
        depends_on:
            postgresql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - argos-network

    
networks:
    argos-network:
        driver: bridge

volumes:
    db-data:
    mqtt-data:
    auth-db:
    auth-redis: