services:
    nginx:
        image: nginx:alpine
        container_name: argos-nginx
        networks:
            - argos-network
        ports:
            - "8080:80"
            # - "4443:443" decommentare se non si usa ngrok
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
            - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
        depends_on:
            - backend
            - dashboard
            - mediamtx

    dashboard:
        build: ./frontend
        container_name: argos-dashboard
        networks:
            - argos-network
        ports:
            - "3000:3000"
        environment:
            - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_TOKEN:-}
    
    backend:
        build: ./backend
        container_name: argos-backend
        networks:
            - argos-network
        expose:
            - "10170"
        depends_on:
            - db
            - mqtt
    
    db:
        image: postgres:16
        container_name: argos-db
        networks:
            - argos-network
        expose:
            - "5432"
        environment:
            POSTGRES_DB: argos
            POSTGRES_USER: argos
            POSTGRES_PASSWORD: argos
        volumes:
            - db-data:/var/lib/postgresql/data
    
    mqtt:
        image: eclipse-mosquitto
        container_name: argos-mqtt
        networks:
            - argos-network
        ports:
            - "1883:1883"
            # - "8883:8883" decommento quando metto tls
            - "9001:9001"
        volumes:
            - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
            - mqtt-data:/mosquitto/data/
    
    mediamtx:
        image: bluenviron/mediamtx
        container_name: argos-mediamtx
        networks:
            - argos-network
        ports:
            - "8888:8888"
            - "1935:1935"
networks:
    argos-network:
        driver: bridge

volumes:
    db-data:
    mqtt-data: